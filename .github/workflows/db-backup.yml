name: Daily Database Backup

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_HOST: db.kcqalauwcfkefqetezzu.supabase.co
        run: |
          set -euo pipefail
          IPV4=$(getent ahostsv4 "${DB_HOST}" \
            | head -1 | awk '{print $1}')
          if [ -z "${IPV4}" ]; then
            echo "Failed to resolve ${DB_HOST} to IPv4"
            exit 1
          fi
          echo "Resolved ${DB_HOST} -> ${IPV4}"
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          FILENAME="backup_${TIMESTAMP}.sql.gz"
          pg_dump \
            "host=${IPV4} port=5432 user=postgres dbname=postgres sslmode=require" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            | gzip > "${FILENAME}"
          FILE_SIZE=$(du -h "${FILENAME}" | cut -f1)
          echo "Backup created: ${FILENAME} (${FILE_SIZE})"
          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
